name: Release HiveOS rgminer compatibility package

on:
  push:
    tags:
      - "v0.3.3"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged archive
        working-directory: release-assets
        run: sha256sum -c chatgptminer-0.3.3.tar.gz.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/chatgptminer-0.3.3.tar.gz
          release-assets/chatgptminer-0.3.3.tar.gz.sha256
          --title "ChatGPTminer v0.3.3 — HiveOS rgminer compatibility build"
          --notes-file HIVEOS_RGMINER_BACKEND.md
