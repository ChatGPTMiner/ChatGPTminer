name: Release HiveOS package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  hiveos-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test
        run: ./scripts/build.sh

      - name: Package HiveOS archive
        run: ./scripts/package-hiveos.sh 0.2.0

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/chatgptminer-0.2.0-hiveos-linux-x64.tar.gz \
            dist/chatgptminer-0.2.0-hiveos-linux-x64.tar.gz.sha256 \
            --title "ChatGPTminer v0.2.0 — HiveOS preview" \
            --notes-file RELEASE_NOTES.md \
            --prerelease

